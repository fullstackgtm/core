name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The test runner needs node --experimental-strip-types (22.6+).
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # The runtime supports node >=20 (engines), but type stripping for the test
  # runner does not exist there — so validate 20 against the built output.
  node20-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test built CLI
        run: |
          node dist/bin.js doctor
          node dist/bin.js audit --demo --json > /dev/null
          node dist/bin.js rules --json > /dev/null
          echo "node 20 smoke OK"
