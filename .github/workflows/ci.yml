name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The test runner needs node --experimental-strip-types (22.6+).
        node-version: [22]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Supply-chain integrity: the mirror commits dist/ so `npm install github:…`
  # works without a build step. Verify that committed dist is exactly a fresh
  # build from src/ — a poisoned or stale committed dist (which git-install
  # users would run unbuilt) fails here.
  dist-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild dist from source
        run: npm run build
      - name: Committed dist must match the fresh build
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::Committed dist/ differs from a fresh build of src/. Rebuild and recommit (scripts/sync-oss.sh), or investigate tampering." >&2
            git diff --stat -- dist
            exit 1
          fi
          echo "dist integrity OK"

  # Source tests require Node 22's type stripping. Validate the declared Node
  # 20 runtime and all supported runner OSes against compiled output instead.
  runtime-matrix:
    name: Runtime (Node ${{ matrix.node }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test built CLI
        run: |
          node dist/bin.js --help
          node dist/mcp-bin.js --help
          node dist/bin.js audit --demo --json > /dev/null
          node dist/bin.js rules --json > /dev/null

  packed-install:
    name: Packed install (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify tarball without optional peers
        run: node scripts/verify-packed-install.mjs
      - name: Verify tarball with optional peers
        run: node scripts/verify-packed-install.mjs --with-peers
