name: Release

# Publishes to npm when a release tag is pushed:
#   git tag v1.2.2 && git push origin v1.2.2
# Auth is npm Trusted Publishing (OIDC) — no tokens or secrets. The trusted
# publisher is configured on npmjs.com (package fullstackgtm → Settings →
# Trusted Publisher: GitHub Actions, fullstackgtm/core, release.yml).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1; runners bundle an older npm.
      - name: Install audited npm version
        run: |
          npm install -g --ignore-scripts npm@11.5.1
          test "$(npm --version)" = "11.5.1"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # Publish from a fresh build, never the committed dist — the npm tarball is
      # then provably from source even if the committed dist were tampered.
      - name: Build from source
        run: npm run build

      - name: Verify committed dist matches the fresh build (supply-chain integrity)
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::Committed dist/ does not match a fresh build from src/ — refusing to publish. Rebuild and recommit, or investigate tampering." >&2
            git diff --stat -- dist
            exit 1
          fi

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Verify full source provenance
        run: |
          SOURCE_SHA=$(node -p "require('./SOURCE_PROVENANCE.json').sourceCommit")
          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "SOURCE_PROVENANCE.json does not contain a full source commit SHA" >&2
            exit 1
          fi

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --access public --tag latest --provenance
